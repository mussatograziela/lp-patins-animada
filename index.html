<!DOCTYPE html>
<html lang="pt_br">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snitap Patins</title>

  <link rel="stylesheet" href="styles/index.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,500;1,14..32,500&family=Montserrat:ital,wght@0,500;1,500&family=Syne:wght@700&display=swap"
    rel="stylesheet">
</head>
<body>
  <header class="top">
    <a href="#">
      <img src="assets/images/logo.svg" alt="Logo">
    </a>
    <a href="#">
      <img src="assets/icons/shopping-bag-01.svg" alt="Sacola de compras">
      <span>1</span>
    </a>
  </header>

  <section class="hero">
    <div>
      <h1>
        Snitap, sua vida mais
        <div>
          <span>radical</span>
          <span>divertida</span>
          <span>saudável</span>
          <span>radical</span>
        </div>
      </h1>

      <div class="buttons">
        <a href="#" class="button buy shadow">
          <img src="assets/icons/shopping-bag-01.svg" alt="Sacola de compras">
          COMPRAR AGORA
        </a>

        <a href="#" class="button play">
          <span class="shadow">
            <img src="assets/icons/play.svg" alt="Paly">
          </span>
          VEJA EM AÇÃO
        </a>
      </div>
    </div>

    <div>
      <div class="content">
        <img src="assets/hero/ellipse.svg"  alt="Elipse">
        <img src="assets/hero/patins-image.png" alt="Patins">
        <img src="assets/hero/stars-1.svg" alt="Estrelas">
        <img src="assets/hero/stars-2.svg" alt="Estrelas">
      </div>
    </div>
  </section>

  <section class="banner">
    <div class="scroller bg-gradient-animate">
      <div class="rolling">
        <img src="assets/images/banner.svg" alt="Faixa colorida escrito patins">
        <img src="assets/images/banner.svg" alt="Faixa colorida escrito patins">
        <img src="assets/images/banner.svg" alt="Faixa colorida escrito patins">
        <img src="assets/images/banner.svg" alt="Faixa colorida escrito patins">
        <img src="assets/images/banner.svg" alt="Faixa colorida escrito patins">
        <img src="assets/images/banner.svg" alt="Faixa colorida escrito patins">
        <img src="assets/images/banner.svg" alt="Faixa colorida escrito patins">
        <img src="assets/images/banner.svg" alt="Faixa colorida escrito patins">
        <img src="assets/images/banner.svg" alt="Faixa colorida escrito patins">
        <img src="assets/images/banner.svg" alt="Faixa colorida escrito patins">
        <img src="assets/images/banner.svg" alt="Faixa colorida escrito patins">
        <img src="assets/images/banner.svg" alt="Faixa colorida escrito patins">
        <img src="assets/images/banner.svg" alt="Faixa colorida escrito patins">
        <img src="assets/images/banner.svg" alt="Faixa colorida escrito patins">
        <img src="assets/images/banner.svg" alt="Faixa colorida escrito patins">
        <img src="assets/images/banner.svg" alt="Faixa colorida escrito patins">
        <img src="assets/images/banner.svg" alt="Faixa colorida escrito patins">
        <img src="assets/images/banner.svg" alt="Faixa colorida escrito patins">
        <img src="assets/images/banner.svg" alt="Faixa colorida escrito patins">
        <img src="assets/images/banner.svg" alt="Faixa colorida escrito patins">
      </div>
    </div>
  </section>

  <section class="gallery">
    <header>
      <span>GALERIA DE FOTOS</span>
      <h2>#usesnitap por aí</h2>
    </header>
    
    <div class="content">
      <figure>
        <img src="assets/images/01.png" alt="jovem branca, de cabelos pretos, usando uma regata e shorts branco, uma jaqueta cinza, patins brancos e meias vermelhas, fazendo uma pose com uma das pernas para cima">
        <figcaption>
          <img src="assets/images/person.png" alt="foto de um perfil no instragram">
          <span>@laviniaoereira</span>
        </figcaption>
      </figure>

      <figure data-delay>
        <img src="assets/images/02.png" alt="grupo de pessoas patinando juntos">
        <figcaption>
          <img src="assets/images/person.png" alt="foto de um perfil no instragram">
          <span>@laviniaoereira</span>
        </figcaption>
      </figure>

      <figure>
        <img src="assets/images/03.png" alt="juma pessoa sentada locando o patins">
        <figcaption>
          <img src="assets/images/person.png" alt="foto de um perfil no instragram">
          <span>@laviniaoereira</span>
        </figcaption>
      </figure>

      <figure data-delay>
        <img src="assets/images/04.png" alt="uma pessoa em pé com patins, mostrando somente os pés">
        <figcaption>
          <img src="assets/images/person.png" alt="foto de um perfil no instragram">
          <span>@laviniaoereira</span>
        </figcaption>
      </figure>
    </div>
  </section>
